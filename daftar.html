<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendaftaran Tahlil Ramadan 1448H</title><link rel="stylesheet" href="portal.css"><style>
main{max-width:680px;margin:2rem auto;padding:1rem}label{display:grid;gap:.4rem;margin:1rem 0}input,textarea,select{font:inherit;padding:.7rem;border-radius:.5rem;color:#142b23;background:#fff8e7;width:100%;box-sizing:border-box}[hidden]{display:none!important}textarea{resize:vertical}
</style><script src="urusetia-config.js" defer></script><script defer src="daftar.js"></script></head>
<body><main><a href="./">Laman Utama</a><h1>Pendaftaran Tahlil Ramadan 1448H</h1><p id="status" role="status">Menyemak status pendaftaran…</p>
<form id="daftar" hidden><label>Pakej penyertaan<select id="packageId" required></select></label><label>Nama peserta<input id="name" autocomplete="name" maxlength="160" required></label><label>E-mel<input id="email" type="email" autocomplete="email" maxlength="254" required></label><label>Nombor WhatsApp<input id="phone" type="tel" autocomplete="tel" maxlength="35" required></label><label>Nama arwah, satu nama setiap baris<textarea id="names" rows="5" maxlength="10000" required></textarea></label><label>Bukti bayaran (JPG, PNG atau PDF, maksimum 3 MB)<input id="proof" type="file" accept="image/jpeg,image/png,application/pdf" required></label><button class="button" type="submit">Hantar Pendaftaran</button></form></main></body></html>
