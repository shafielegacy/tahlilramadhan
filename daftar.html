<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendaftaran Tahlil Ramadan 1448H</title><link rel="stylesheet" href="portal.css"><style>
main{max-width:680px;margin:2rem auto;padding:1rem}label{display:grid;gap:.4rem;margin:1rem 0}input,textarea,select{font:inherit;padding:.7rem;border-radius:.5rem;color:#142b23;background:#fff8e7;width:100%;box-sizing:border-box}[hidden]{display:none!important}textarea{resize:vertical}
.home-link{display:inline-flex;align-items:center;gap:.55rem;margin:0 0 .9rem;padding:.55rem .9rem;border:1px solid #c5a562;border-radius:.65rem;background:#173d32;color:#fff1c9;text-decoration:none;font-weight:700;line-height:1.25;box-shadow:0 2px 5px #0003}
.home-link:hover{background:#285246;color:#fff8e7}
.home-link:focus-visible{outline:2px solid #ffdc93;outline-offset:3px}
.submission-dialog{box-sizing:border-box;width:min(28rem,calc(100% - 2rem));max-height:calc(100% - 2rem);padding:1.75rem;border:1px solid #ae9257;border-radius:1.25rem;background:#204238;color:#fff1cc;box-shadow:0 1rem 3rem #0008;text-align:center}
.submission-dialog::backdrop{background:#081914c9}
.submission-dialog h2{font-size:clamp(1.5rem,5vw,2rem);margin:.65rem 0}
.submission-dialog p{color:#fff1cc;margin:.65rem 0 1rem}
.submission-spinner{display:block;width:2.6rem;height:2.6rem;margin:.3rem auto 1rem;border:.2rem solid #ffda8f45;border-top-color:#ffda8f;border-radius:50%;animation:submission-spin .85s linear infinite}
@keyframes submission-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.submission-spinner{animation:none}}
</style><script src="urusetia-config.js" defer></script><script defer src="daftar.js?v=submit-popup1"></script></head>
<body><main><a class="home-link" href="./"><span aria-hidden="true">←</span> Laman Utama</a><h1>Pendaftaran Tahlil Ramadan 1448H</h1><p id="status" role="status">Menyemak status pendaftaran…</p>
<button id="google-login" class="button" type="button" hidden>Log Masuk dengan Google</button>
<form id="daftar" hidden><label>Pakej penyertaan<select id="packageId" required></select></label><label>Nama peserta<input id="name" autocomplete="name" maxlength="160" required></label><label>E-mel<input id="email" type="email" autocomplete="email" maxlength="254" readonly required></label><label>Nombor WhatsApp<input id="phone" type="tel" autocomplete="tel" maxlength="35" required></label><label>Nama arwah, satu nama setiap baris<textarea id="names" rows="5" maxlength="10000" required></textarea></label><label>Bukti bayaran (JPG, PNG atau PDF, maksimum 3 MB)<input id="proof" type="file" accept="image/jpeg,image/png,application/pdf" required></label><button class="button" type="submit">Hantar Pendaftaran</button></form>
<dialog id="submission-dialog" class="submission-dialog" aria-labelledby="submission-title" aria-describedby="submission-message">
  <span id="submission-spinner" class="submission-spinner" aria-hidden="true" hidden></span>
  <h2 id="submission-title">Status Permohonan</h2>
  <p id="submission-message" role="status"></p>
  <form method="dialog"><button id="submission-close" class="button" type="submit">Tutup</button></form>
</dialog></main></body></html>
