<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pendaftaran Tahlil Ramadan 1448H</title><link rel="stylesheet" href="portal.css"><style>
main{max-width:680px;margin:2rem auto;padding:1rem}label{display:grid;gap:.4rem;margin:1rem 0}input,textarea,select{font:inherit;padding:.7rem;border-radius:.5rem;color:#142b23;background:#fff8e7;width:100%;box-sizing:border-box}[hidden]{display:none!important}textarea{resize:vertical}
.home-link{display:inline-flex;align-items:center;gap:.55rem;margin:0 0 .9rem;padding:.55rem .9rem;border:1px solid #c5a562;border-radius:.65rem;background:#173d32;color:#fff1c9;text-decoration:none;font-weight:700;line-height:1.25;box-shadow:0 2px 5px #0003}
.home-link:hover{background:#285246;color:#fff8e7}
.home-link:focus-visible{outline:2px solid #ffdc93;outline-offset:3px}
.submit-feedback{display:flex;align-items:center;flex-wrap:wrap;gap:.75rem;margin-top:.25rem}
.submit-indicator{display:inline-flex;align-items:center;gap:.55rem;color:#fff1cc}
.submit-spinner{width:1.05em;height:1.05em;border:.15em solid #fff1cc55;border-top-color:#ffda8f;border-radius:50%;animation:submit-spin .85s linear infinite}
@keyframes submit-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.submit-spinner{animation:none}}
</style><script src="urusetia-config.js" defer></script><script defer src="daftar.js?v=submit-feedback3"></script></head>
<body><main><a class="home-link" href="./"><span aria-hidden="true">←</span> Laman Utama</a><h1>Pendaftaran Tahlil Ramadan 1448H</h1><p id="status" role="status">Menyemak status pendaftaran…</p>
<button id="google-login" class="button" type="button" hidden>Log Masuk dengan Google</button>
<form id="daftar" hidden><label>Pakej penyertaan<select id="packageId" required></select></label><label>Nama peserta<input id="name" autocomplete="name" maxlength="160" required></label><label>E-mel<input id="email" type="email" autocomplete="email" maxlength="254" readonly required></label><label>Nombor WhatsApp<input id="phone" type="tel" autocomplete="tel" maxlength="35" required></label><label>Nama arwah, satu nama setiap baris<textarea id="names" rows="5" maxlength="10000" required></textarea></label><label>Bukti bayaran (JPG, PNG atau PDF, maksimum 3 MB)<input id="proof" type="file" accept="image/jpeg,image/png,application/pdf" required></label><div class="submit-feedback"><button class="button" type="submit">Hantar Pendaftaran</button><span id="submit-indicator" class="submit-indicator" hidden><span class="submit-spinner" aria-hidden="true"></span>Sedang menghantar permohonan…</span></div></form></main></body></html>
